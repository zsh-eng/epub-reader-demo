<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Undertone</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/library.css" />
  </head>
  <body class="library-open">
    <section
      id="library-shell"
      class="library-shell"
      aria-label="Podcast library"
    >
      <aside class="library-sidebar">
        <a class="wordmark" href="#home" aria-label="Undertone home"
          ><svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path
              d="M4 12v4M9 7v14M14 3v22M19 8v12M24 12v4"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            /></svg
          >undertone</a
        >
        <nav id="library-nav" aria-label="Library"></nav>
        <p class="library-footnote">
          Independent voices.<br />Straight from their feeds.
        </p>
      </aside>
      <main id="library-main" class="library-main">
        <header class="library-header">
          <h1 id="library-title">Good listening.</h1>
          <label class="library-search"
            ><span aria-hidden="true">⌕</span
            ><input
              id="library-search"
              type="search"
              placeholder="Find a voice, a story…"
              aria-label="Search shows and episodes"
          /></label>
        </header>
        <div
          id="library-content"
          class="library-content"
          aria-busy="false"
        ></div>
      </main>
    </section>
    <p id="library-status" role="status"></p>
    <main id="reader-workspace" class="workspace" hidden>
      <aside class="episode-panel">
        <div class="cover-wrap">
          <img
            id="artwork"
            src="/artwork"
            alt="The Ezra Klein Show cover"
            width="320"
            height="320"
          />
        </div>
        <p class="eyebrow" id="show">THE EZRA KLEIN SHOW</p>
        <h1 id="title">Loading…</h1>
        <p id="episode-meta" class="muted"></p>
        <p id="summary" class="summary"></p>
        <div class="chapter-heading">
          <h2>Chapters</h2>
          <span id="chapter-count"></span>
        </div>
        <nav id="chapters" aria-label="Chapters"></nav>
        <a id="source" class="source-link" target="_blank" rel="noreferrer"
          >Original episode ↗</a
        >
      </aside>
      <section class="conversation">
        <div class="transcript-heading">
          <a class="wordmark" href="#home" aria-label="Undertone home"
            ><svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <path
                d="M4 12v4M9 7v14M14 3v22M19 8v12M24 12v4"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              /></svg
            >undertone</a
          ><button
            id="mobile-skips"
            class="pill mobile-skips"
            aria-expanded="false"
            aria-controls="skip-panel"
          >
            Promotions
          </button>

          <button id="follow" class="pill active" aria-pressed="true">
            Follow along
          </button>
        </div>
        <div
          id="transcript"
          class="transcript"
          tabindex="0"
          role="region"
          aria-label="Timed transcript"
        >
          <div id="transcript-space"></div>
        </div>
        <div class="transcript-fade"></div>
      </section>
      <aside id="skip-panel" class="skip-panel">
        <label class="toggle-row" for="skip-toggle"
          ><span>Skip promotions</span
          ><input id="skip-toggle" type="checkbox" checked role="switch"
        /></label>
        <p id="savings" class="savings"></p>
        <div id="detections"></div>
        <details>
          <summary>About detection</summary>
          <p>
            Automatic detection can miss promotions. Undo replays a skipped
            passage.
          </p>
          <p id="photo-credits"></p>
        </details>
      </aside>
    </main>
    <footer class="player">
      <button
        id="now-playing"
        class="player-now"
        aria-label="Open current episode"
      >
        <span class="now-dot"></span>
        <div>
          <p id="now-chapter"></p>
          <span id="now-speaker">The Ezra Klein Show</span>
        </div>
      </button>
      <div class="transport">
        <div class="transport-buttons">
          <button id="back" class="icon-button" aria-label="Back 15 seconds">
            <svg viewBox="0 0 24 24">
              <path d="M5 8V3m0 5h5M5 8a8 8 0 1 1-1 9" />
              <text x="7" y="16">15</text>
            </svg></button
          ><button
            id="play"
            class="play-button"
            aria-label="Play"
            title="Play / pause (Space)"
          >
            <svg viewBox="0 0 24 24">
              <path class="play-symbol" d="m9 5 11 7-11 7z" />
              <path class="pause-symbol" d="M7 5h4v14H7zM15 5h4v14h-4z" />
            </svg></button
          ><button
            id="forward"
            class="icon-button"
            aria-label="Forward 15 seconds"
          >
            <svg viewBox="0 0 24 24">
              <path d="M19 8V3m0 5h-5m5 0a8 8 0 1 0 1 9" />
              <text x="7" y="16">15</text>
            </svg>
          </button>
        </div>
        <div class="seek-row">
          <time id="elapsed">0:00</time>
          <div class="track">
            <div id="stream-track" aria-hidden="true" hidden>
              <div id="buffered-ranges"></div>
              <i id="stream-progress"></i>
            </div>
            <div id="waveform" aria-hidden="true"></div>
            <div id="skip-marks" aria-hidden="true"></div>
            <input
              id="seek"
              type="range"
              min="0"
              max="100"
              step="0.05"
              value="0"
              aria-label="Playback position"
            />
          </div>
          <time id="duration">—</time>
        </div>
      </div>
      <div class="player-options">
        <button id="speed" class="pill" aria-label="Playback speed">1×</button>
      </div>
    </footer>
    <div
      id="toast"
      class="toast"
      role="status"
      data-open="false"
      aria-hidden="true"
      inert
    >
      <span id="toast-text"></span><button id="undo">Undo</button>
    </div>
    <span id="playback-status" class="sr-only" role="status"></span>
    <div id="error" class="error" role="alert" hidden></div>
    <audio id="audio" preload="metadata"></audio>
    <script type="module" src="/player.js"></script>
  </body>
</html>

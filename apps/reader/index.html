<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Reader</title>
    <meta name="description" content="A modern ebook reader" />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
      sizes="180x180"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Inline script to apply theme immediately before render to prevent flash -->
    <script>
      (function () {
        const STORAGE_KEY = "epub-reader-settings";
        const APPEARANCE_STORAGE_KEY = "epub-reader-appearance";
        const THEME_CLASSES = [
          "light",
          "dark",
          "night",
          "flexoki-light",
          "flexoki-dark",
        ];
        const DEFAULT_THEME = "light";

        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          const settings = stored ? JSON.parse(stored) : null;
          let theme =
            settings?.theme && THEME_CLASSES.includes(settings.theme)
              ? settings.theme
              : DEFAULT_THEME;
          const appearance = localStorage.getItem(APPEARANCE_STORAGE_KEY);
          if (appearance === "system") {
            const useDarkTheme = matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;
            const useFlexoki = theme.startsWith("flexoki");
            const useNight = theme === "night";
            if (useFlexoki) {
              theme = useDarkTheme ? "flexoki-dark" : "flexoki-light";
            } else if (useNight) {
              theme = useDarkTheme ? "night" : "light";
            } else {
              theme = useDarkTheme ? "dark" : "light";
            }
          }
          document.documentElement.classList.add(theme);
          if (theme === "night") {
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", "#000000");
          }
        } catch (e) {
          document.documentElement.classList.add(DEFAULT_THEME);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
